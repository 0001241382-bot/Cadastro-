<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Web Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <div class="container-formulario">
    <h1>Cadastro:</h1>
     <form action="salvar.php" method="POST">
        <ul>
            <li>
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="E-mail@.com:" required>
            </li>
            <li>
                <label for="senha">Criar uma Senha</label>
                <div class="campo-senha-wrapper">
                <input type="password" id="senha" name="senha" placeholder="Didite sua senha:" required>
                 <button type="button" id="btn-mostrar-senha">👁️</button>
         </div>
            </li>
            <li>
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome:" required>
            </li>
            <li>
                <label for="endereco">Endereço</label>
                <input type="text" id="endereco" name="endereco" placeholder="Rua, Numero ou Bairro:" required>
            </li>
            <li>
                <label for="CPF">CPF</label>
                <input type="text" id="CPF" name="CPF" inputmode="numeric" placeholder="Digite seu CPF:" required>
            </li>
        </ul>
         <div class="preview-container">
                <img id="preview-imagem" src="" alt="Sua foto de perfil">
            </div>

            <label for="foto">Selecione a Imagem:</label>
            <input type="file" id="foto" name="foto" accept="image/*" required><br><br>
            
            <button type="submit">Criar Conta</button>
        </form>
     </div>
    </form>
     </div>
      <script src="script.js"></script>
</body>
</html>
